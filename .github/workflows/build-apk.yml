name: Build TNPSC Study Hub APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Move HTML files into web folder
        run: |
          mkdir -p www
          mv *.html www/ 2>/dev/null || true
          mv *.css www/ 2>/dev/null || true
          mv *.js www/ 2>/dev/null || true

      - name: Init npm project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "TNPSC Study Hub" "com.tnpsc.studyhub" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tnpsc-study-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
